
{% extends 'scanner/base.html' %}
{% block content %}
  
<h1 class ="mb-4">
    Create Project
</h1>

<div class="card">
    <div class="card-body">
        <form method ="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type ="submit">Create Project</button>
        <a class="btn btn-outline-secondary"
               href="{% url 'scanner:project_list' %}">
                Cancel
            </a>
    </form>
        
    </div>
</div>

{% endblock %}
