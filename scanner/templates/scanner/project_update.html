
{% extends 'scanner/base.html' %}
{% block content %}
  
<h1 class ="mb-4">
    Update Project
</h1>

<div class="card">
    <div class="card-body">
        <form method ="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type ="submit">Update Project</button>
        <a class="btn btn-outline-secondary"
               href="{% url 'scanner:project_list' %}">
                Cancel
            </a>
    </form>
        
    </div>
</div>
{% endblock %}
<!-- mt-4  → margin-top
mb-4  → margin-bottom
ms-3  → margin-start
me-3  → margin-end
mx-3  → margin يمين ويسار
my-3  → margin فوق وتحت

pt-3  → padding-top
pb-3  → padding-bottom
px-3  → padding يمين ويسار
py-3  → padding فوق وتحت -->
