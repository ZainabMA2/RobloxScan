{% extends 'scanner/base.html' %}
{% block content %}
  

<h1 class ="mb-4">
    Delete Project
</h1>

<div class="card">
    <div class="card-body">
        <P>
            Are you sure you want to delete
            <strong>"{{object.name}}"</strong> ?

            </P>

    
        <form method ="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-danger" type ="submit">Delete Project</button>
        <a class="btn btn-outline-secondary"
               href="{% url 'scanner:project_detail' object.pk %}">
                Cancel
            </a>
    </form>
        
    </div>
</div>
{% endblock %}
