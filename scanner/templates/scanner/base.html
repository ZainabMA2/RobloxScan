<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RobloxScan</title>
    
    
</head>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>
<body  >

<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">

        <a class="navbar-brand" href="{% url 'scanner:dashboard' %}">
            RobloxScan
        </a>

        <div class="navbar-nav me-auto"> #me as mergin-end
            <a class="nav-link" href="{% url 'scanner:dashboard' %}">
                Dashboard
            </a>

            <a class="nav-link" href="{% url 'scanner:project_list' %}">
                Projects
            </a>
        </div>

        {% if request.user.is_authenticated %}

            <span class="navbar-text me-3">
                Welcome {{ request.user.username }}
            </span>

            <form method="post"
                  action="{% url 'accounts:logout' %}">
                {% csrf_token %}

                <button class="btn btn-outline-light" type="submit">
                    Logout
                </button>
            </form>

        {% else %}

            <a class="btn btn-outline-light me-2"
               href="{% url 'accounts:login' %}">
                Login
            </a>

            <a class="btn btn-light"
               href="{% url 'accounts:register' %}">
                Register
            </a>

        {% endif %}

    </div>
</nav>
    <hr>

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>
</body>
</html>
